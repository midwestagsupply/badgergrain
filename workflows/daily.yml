# Runs every morning. Two jobs, both small.
#
#   1. Update the "Open today" box so it says the right day and the right
#      hours. Without this the box goes stale and lies. See the note at
#      the top of tools/update-today.mjs.
#
#   2. Check the Wisconsin statutory notices have not drifted from the
#      other site's copy.
#
# Needs no secrets. The built-in GITHUB_TOKEN is enough.

name: Daily

on:
  schedule:
    - cron: "10 11 * * *"   # 6:10am Central, before anyone hauls
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Check the statutory notices
        run: node tools/check-notices.mjs

      - name: Update today's hours
        run: node tools/update-today.mjs

      - name: Commit if it changed
        run: |
          git config user.name  "daily hours"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "hours: $(TZ=America/Chicago date +%A\ %-d\ %B)"
          git push
